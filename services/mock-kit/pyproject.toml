[project]
name = "freight-agents-mock-kit"
version = "0.1.0"
description = "Idempotency-Key handling and problem details shared by the made-up services"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
