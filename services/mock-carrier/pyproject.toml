[project]
name = "freight-agents-mock-carrier"
version = "0.1.0"
description = "A made-up carrier claims API and portal, for tests and demos"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "python-multipart>=0.0.9", "freight-agents-mock-kit"]

[tool.uv.sources]
freight-agents-mock-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
