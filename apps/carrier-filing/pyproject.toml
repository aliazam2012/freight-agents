[project]
name = "freight-agents-carrier-filing"
version = "0.1.0"
description = "File a complete freight claim once, by API, portal or email, and track the 49 CFR 370 deadlines"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "freight-agents-llm",
    "freight-agents-agentcore",
    "freight-agents-statecore",
    "freight-agents-evals",
    "freight-agents-integrations",
    "freight-agents-claims-intake",
    "playwright>=1.49",
    "reportlab>=4.2",
]

[tool.uv.sources]
freight-agents-llm = { workspace = true }
freight-agents-agentcore = { workspace = true }
freight-agents-statecore = { workspace = true }
freight-agents-evals = { workspace = true }
freight-agents-integrations = { workspace = true }
freight-agents-claims-intake = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
