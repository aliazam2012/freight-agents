[project]
name = "freight-agents"
version = "0.1.0"
description = "Reliable agent workflows for freight operations, on a shared platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "opentelemetry-sdk>=1.27",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tools"]
addopts = "-q --import-mode=importlib --strict-markers"
