[project]
name = "freight-agents"
version = "0.1.0"
description = "Reliable agent workflows for freight operations, on a shared platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "opentelemetry-sdk>=1.27",
    "pandas-stubs>=2.2",
    "pre-commit>=4",
    "pytest>=8.3",
    "reportlab>=4.2",
    "types-reportlab>=4.2",
    "ruff>=0.8",
]

[tool.uv]
package = false
# cryptography 49 and later publish no Intel Mac wheels, so uv would build it from
# source there and link whatever OpenSSL Homebrew had that day. The last release
# with an Intel Mac wheel keeps that machine on a published, self-contained build.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

# scikit-learn and statsmodels ship no type information; their calls are
# confined to models.py, behind typed wrappers.
[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "services", "tools"]
addopts = "-q --import-mode=importlib --strict-markers"
