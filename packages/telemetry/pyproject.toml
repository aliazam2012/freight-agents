[project]
name = "freight-agents-telemetry"
version = "0.1.0"
description = "OpenTelemetry spans with GenAI attributes, and a cost meter"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["opentelemetry-api>=1.27", "freight-agents-llm"]

[tool.uv.sources]
freight-agents-llm = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
