[project]
name = "freight-agents-devtools"
version = "0.1.0"
description = "Repository checks for the freight agents repos: clean-room scan, Markdown links, private denylist"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
freight-purity = "freight_agents.devtools.purity:run"
freight-links = "freight_agents.devtools.check_links:run"
freight-denylist = "freight_agents.devtools.denylist_check:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
