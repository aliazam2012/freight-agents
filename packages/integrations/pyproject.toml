[project]
name = "freight-agents-integrations"
version = "0.1.0"
description = "Email in, email out, and a TMS client"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pypdf>=5.1", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
