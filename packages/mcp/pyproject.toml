[project]
name = "freight-agents-mcp"
version = "0.1.0"
description = "Serve any tool registry over MCP, every call through the same hooks"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3", "freight-agents-agentcore"]

[tool.uv.sources]
freight-agents-agentcore = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agents"]
